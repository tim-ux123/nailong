<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美食智能体 · 推理驱动</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink: #ff8fc7;
    --pink-deep: #ff5fae;
    --glass: rgba(255, 255, 255, 0.14);
    --glass-strong: rgba(255, 255, 255, 0.26);
    --text: #fff;
    --text-dim: rgba(255, 255, 255, 0.72);
  }
  html, body { height: 100%; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 22%, #fbc2eb 48%, #a18cd1 78%, #ff9a9e 100%);
    background-size: 300% 300%;
    animation: bgShift 18s ease infinite;
    overflow: hidden;
  }
  @keyframes bgShift { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  /* 漂浮光斑 */
  .blob { position: fixed; border-radius: 50%; filter: blur(60px); opacity: 0.55; pointer-events: none; z-index: 0; }
  .b1 { width: 420px; height: 420px; background: #ff77b7; top: -120px; left: -80px; animation: float1 14s ease-in-out infinite; }
  .b2 { width: 360px; height: 360px; background: #b98cff; bottom: -120px; right: -60px; animation: float2 16s ease-in-out infinite; }
  .b3 { width: 260px; height: 260px; background: #ffd36e; top: 40%; left: 55%; animation: float1 12s ease-in-out infinite reverse; }
  @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,30px); } }
  @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,-30px); } }

  .app {
    position: relative; z-index: 1;
    height: 100%; max-width: 900px; margin: 0 auto;
    display: flex; flex-direction: column; padding: 22px 18px;
  }

  /* 头部 */
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 22px; margin-bottom: 16px;
    background: var(--glass); border: 1px solid rgba(255,255,255,0.35);
    border-radius: 22px; backdrop-filter: blur(18px);
    box-shadow: 0 8px 32px rgba(255,95,174,0.25);
  }
  .avatar {
    width: 66px; height: 66px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, var(--pink-deep));
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; flex-shrink: 0;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.4), 0 6px 20px rgba(255,95,174,0.5);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  .title h1 { font-size: 22px; letter-spacing: 1px; text-shadow: 0 2px 8px rgba(255,95,174,0.5); }
  .title p { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #6ee7a0; box-shadow: 0 0 8px #6ee7a0; animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* 聊天区 */
  .chat {
    flex: 1; overflow-y: auto; padding: 6px 4px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .chat::-webkit-scrollbar { width: 8px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.4); border-radius: 8px; }

  .msg { display: flex; gap: 12px; max-width: 82%; animation: rise 0.4s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg .pic { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .msg.bot .pic { background: radial-gradient(circle at 30% 30%, #fff, var(--pink-deep)); box-shadow: 0 4px 14px rgba(255,95,174,0.5); }
  .msg.user .pic { background: radial-gradient(circle at 30% 30%, #fff, #a18cd1); box-shadow: 0 4px 14px rgba(161,140,209,0.5); }
  .bubble { padding: 13px 17px; border-radius: 18px; line-height: 1.65; font-size: 15px; backdrop-filter: blur(12px); }
  .msg.bot .bubble { background: var(--glass-strong); border: 1px solid rgba(255,255,255,0.4); border-top-left-radius: 5px; box-shadow: 0 6px 24px rgba(255,95,174,0.18); }
  .msg.user .bubble { background: linear-gradient(135deg, var(--pink-deep), #ff9ad5); border-top-right-radius: 5px; box-shadow: 0 6px 24px rgba(255,95,174,0.4); }

  /* 推理轨迹 */
  .trace { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .trace-toggle { font-size: 12px; color: var(--pink-deep); cursor: pointer; user-select: none; font-weight: 600; }
  .step { font-size: 12.5px; padding: 8px 11px; border-radius: 11px; background: rgba(255,255,255,0.16); border-left: 3px solid var(--pink); color: var(--text); animation: rise 0.35s ease; }
  .step .tag { font-weight: 700; color: #fff; background: rgba(255,95,174,0.55); padding: 1px 7px; border-radius: 6px; margin-right: 6px; font-size: 11px; }
  .step.tool { border-left-color: #ffd36e; }
  .step.tool .tag { background: rgba(255,180,40,0.6); }
  .step .body { color: var(--text-dim); word-break: break-word; }

  /* 打字指示 */
  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--pink-deep); animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-8px); opacity: 1; } }

  /* 输入区 */
  .inputbar {
    display: flex; gap: 12px; margin-top: 16px; padding: 12px;
    background: var(--glass); border: 1px solid rgba(255,255,255,0.35);
    border-radius: 20px; backdrop-filter: blur(18px);
    box-shadow: 0 8px 32px rgba(255,95,174,0.22);
  }
  .inputbar input {
    flex: 1; border: none; outline: none; background: transparent;
    color: var(--text); font-size: 15px; padding: 8px 6px;
  }
  .inputbar input::placeholder { color: rgba(255,255,255,0.6); }
  .send {
    border: none; cursor: pointer; padding: 0 26px; border-radius: 14px;
    font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--pink-deep), #ff9ad5);
    box-shadow: 0 6px 18px rgba(255,95,174,0.5); transition: transform 0.15s, box-shadow 0.15s;
  }
  .send:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255,95,174,0.65); }
  .send:active { transform: scale(0.96); }
  .send:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 12px; }
  .chip { font-size: 13px; padding: 7px 14px; border-radius: 14px; cursor: pointer;
    background: var(--glass); border: 1px solid rgba(255,255,255,0.4); color: var(--text);
    backdrop-filter: blur(10px); transition: all 0.18s; }
  .chip:hover { background: var(--glass-strong); transform: translateY(-2px); }

  .hint { text-align: center; font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 8px; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="app">
    <header>
      <div class="avatar">🍳</div>
      <div class="title">
        <h1>美食智能体</h1>
        <p>推理驱动 · 本地 qwen3.5:0.8b · ReAct 工具调用</p>
      </div>
      <div class="status"><span class="dot"></span><span id="statusText">在线</span></div>
    </header>

    <div class="chat" id="chat">
      <div class="msg bot">
        <div class="pic">🍳</div>
        <div class="bubble">嗨，我是美食智能体！想问菜谱、查营养、要推荐都可以。我会先调用工具查真实数据，再推理回答你～ 试试下面的快捷问题吧！</div>
      </div>
    </div>

    <div class="chips" id="chips">
      <div class="chip">宫保鸡丁怎么做？</div>
      <div class="chip">红烧肉的热量高吗？</div>
      <div class="chip">想吃辣的，有什么推荐？</div>
      <div class="chip">清蒸鲈鱼需要什么食材？</div>
    </div>

    <form class="inputbar" id="form">
      <input id="msg" type="text" placeholder="输入你的美食问题…" autocomplete="off">
      <button class="send" id="send" type="submit">发送</button>
    </form>
    <div class="hint">回答下方可展开「推理过程」，查看模型如何调用工具与推理</div>
  </div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('msg');
const sendBtn = document.getElementById('send');
const statusText = document.getElementById('statusText');

function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function addUser(text){
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="pic">🙋</div><div class="bubble">${esc(text)}</div>`;
  chat.appendChild(d); scroll();
}

function addTyping(){
  const d = document.createElement('div');
  d.className = 'msg bot'; d.id = 'typing';
  d.innerHTML = `<div class="pic">🍳</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(d); scroll(); return d;
}

function renderTrace(trace){
  if(!trace || !trace.length) return '';
  const labels = { model:'模型', tool:'工具', answer:'结论' };
  const steps = trace.map(t => {
    if(t.type === 'tool'){
      const auto = t.auto ? ' <span style="opacity:.6">(自动补调)</span>' : '';
      return `<div class="step tool"><span class="tag">工具</span>${esc(t.action)}${auto}<div class="body">↳ ${esc(t.observation)}</div></div>`;
    }
    if(t.type === 'model'){
      return `<div class="step"><span class="tag">模型</span><span class="body">${esc(t.text)}</span></div>`;
    }
    return '';
  }).join('');
  return `<div class="trace"><span class="trace-toggle">▸ 展开推理过程</span><div class="trace-body" style="display:none;margin-top:8px">${steps}</div></div>`;
}

function addBot(reply, trace){
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = `<div class="pic">🍳</div><div class="bubble">${esc(reply)}${renderTrace(trace)}</div>`;
  const tg = d.querySelector('.trace-toggle');
  if(tg){ tg.onclick = () => { const b = d.querySelector('.trace-body'); const open = b.style.display !== 'none'; b.style.display = open ? 'none':'block'; tg.textContent = (open?'▸':'▾') + ' 展开推理过程'; }; }
  chat.appendChild(d); scroll();
}

function scroll(){ chat.scrollTop = chat.scrollHeight; }

async function ask(text){
  addUser(text);
  sendBtn.disabled = true; input.value = '';
  const t = addTyping();
  try{
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ message: text }) });
    const data = await r.json();
    t.remove();
    if(data.error){ addBot('出错了：' + data.error, []); setStatus(false); }
    else addBot(data.reply, data.trace);
  }catch(e){
    t.remove(); addBot('无法连接服务，请确认已运行 python server.py 且 Ollama 在线。', []); setStatus(false);
  }finally{ sendBtn.disabled = false; input.focus(); }
}

function setStatus(ok){ statusText.textContent = ok ? '在线' : '离线'; document.querySelector('.dot').style.background = ok ? '#6ee7a0' : '#ff6b6b'; }

form.onsubmit = e => { e.preventDefault(); const v = input.value.trim(); if(v) ask(v); };
document.querySelectorAll('.chip').forEach(c => c.onclick = () => ask(c.textContent));

// 健康检查
fetch('/api/health').then(r=>r.json()).then(d=>{ setStatus(d.status==='ok'); }).catch(()=>setStatus(false));
</script>
</body>
</html>
